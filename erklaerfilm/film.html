<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erklärfilm Erfassungsbogen</title>
<style>
  @font-face { font-family: "Archivo"; font-weight: 100 900; src: url("../public/schrift/archivo-latin-wght-normal.woff2") format("woff2"); }
  /* Bangers und Comic Neue: SIL Open Font License 1.1 (Google Fonts), lokal für Offline-Rendern. */
  @font-face { font-family: "Bangers"; src: url("schrift/bangers-latin.woff2") format("woff2"); }
  @font-face { font-family: "Comic Neue"; font-weight: 700; src: url("schrift/comic-neue-700-latin.woff2") format("woff2"); }
  :root { --blau: #12275e; --gelb: #ffd23f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0b0f1a; color: #fff; font-family: Archivo, sans-serif; overflow: hidden; }
  #buehne { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #000; }
  #buehne > * { position: absolute; inset: 0; }
  #unten { z-index: 1; } #app { z-index: 2; } #oben { z-index: 3; }
  #untertitel { z-index: 5; inset: auto 0 34px 0; margin: 0 auto; width: fit-content; max-width: 1500px; padding: 14px 28px;
    background: rgba(8, 12, 28, .93); border: 4px solid #111; box-shadow: 8px 8px 0 #111; font: 700 38px/1.3 "Comic Neue", Archivo, sans-serif; text-align: center; opacity: 0; }

  /* App-Ebene */
  .app-grund { position: absolute; inset: 0; background:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,.08), transparent 50%),
      radial-gradient(rgba(255,255,255,.10) 2px, transparent 2.5px) 0 0 / 14px 14px,
      linear-gradient(160deg, #1d3d8f, #12275e 60%, #0b1838); }
  .schild { position: absolute; left: 260px; top: 30px; height: 66px; display: flex; align-items: center; }
  .schild span { display: inline-block; padding: 8px 26px; background: var(--gelb); color: #111; border: 5px solid #111; box-shadow: 7px 7px 0 #111;
    font: 400 46px/1 Bangers, Archivo, sans-serif; letter-spacing: 2px; transform: rotate(-1.5deg); }
  .fenster { position: absolute; background: #fff; border: 6px solid #111; box-shadow: 14px 14px 0 #111; overflow: hidden; }
  .fenster-kopf { height: 46px; background: #e6e8ee; border-bottom: 3px solid #111; display: flex; align-items: center; gap: 10px; padding: 0 16px; }
  .fenster-kopf i { width: 16px; height: 16px; border-radius: 50%; background: #c9cede; border: 2px solid #111; }
  .adresse { margin-left: 20px; flex: 1; max-width: 640px; height: 30px; background: #fff; border: 2px solid #9aa3b8; border-radius: 15px; padding: 0 16px; font: 600 18px/26px Archivo, sans-serif; color: #333; }
  .bildflaeche { position: relative; overflow: hidden; background: #f2f3f7; }
  .bildflaeche.papier-grund { background: radial-gradient(rgba(0,0,0,.06) 2px, transparent 2.5px) 0 0 / 14px 14px, #c8ccd6; }
  .kamera { position: absolute; inset: 0; }
  .app-bild { position: absolute; left: 0; top: 0; transform-origin: 0 0; opacity: 0; }
  .app-bild.papier { box-shadow: 0 0 0 2px #111, 16px 16px 0 rgba(0,0,0,.35); background: #fff; }
  .markierung { position: absolute; z-index: 5; border: 6px solid var(--gelb); outline: 3px solid #111; border-radius: 10px; opacity: 0; pointer-events: none; }
  .zeiger { position: absolute; left: 0; top: 0; z-index: 7; opacity: 0; filter: drop-shadow(3px 4px 0 rgba(0,0,0,.45)); }
  .klick { position: absolute; left: -40px; top: -40px; width: 80px; height: 80px; z-index: 6; border-radius: 50%; border: 6px solid var(--gelb); opacity: 0; }

  /* Bedienleiste (nur Vorschau) */
  #leiste { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; display: flex; gap: 14px; align-items: center; padding: 0 16px; background: #111827; z-index: 10; font-size: 15px; }
  #leiste button { font: 700 16px Archivo, sans-serif; padding: 8px 18px; background: var(--gelb); border: 3px solid #000; cursor: pointer; }
  #regler { flex: 1; }
  #zeit { min-width: 200px; font-variant-numeric: tabular-nums; }
  #hinweis { color: #aeb8d6; max-width: 420px; }
  body.render #leiste { display: none; }
</style>
</head>
<body>
  <div id="buehne">
    <div id="unten"></div>
    <div id="app" style="display:none"></div>
    <div id="oben"></div>
    <div id="untertitel"></div>
  </div>
  <div id="leiste">
    <button id="play" type="button">▶ / ❚❚</button>
    <input id="regler" type="range" min="0" value="0" aria-label="Zeit">
    <span id="zeit"></span>
    <span id="hinweis"></span>
  </div>
  <script src="comic.js"></script>
  <script src="film.js"></script>
</body>
</html>
