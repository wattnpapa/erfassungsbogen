# GitLab-CI für den Open-CoDE-Spiegel (gitlab.opencode.de).
#
# Gegenstück zu den GitHub-Actions-Workflows: Der Prüflauf hier bildet
# .github/workflows/ci.yml Schritt für Schritt nach, der Pages-Job entspricht
# build-pages/deploy-pages aus .github/workflows/release.yml. Beide Plattformen
# bauen aus demselben Stand; GitHub ignoriert diese Datei, GitLab ignoriert
# .github/. Gespiegelt wird nur in eine Richtung (GitHub -> Open CoDE), die
# Datei gehört also ins GitHub-Repository und reist von dort mit.
#
# Absichtlich NICHT nachgebildet sind die Release-Jobs aus release.yml
# (prepare/build-win/build-linux/build-android/release):
#   * Die Build-Version und ihr Git-Tag entstehen auf GitHub. Ein hier erzeugter
#     Tag würde beim nächsten Spiegellauf überschrieben, und zurückschreiben
#     kann der Spiegel nicht — er ist eine Lesefassung.
#   * Die Signaturschlüssel (Apple, Android-Keystore, Windows) liegen als
#     GitHub-Secrets und haben auf dem Spiegel nichts zu suchen. Unsignierte
#     Installer wären ein zweiter, schlechterer Download-Weg; Auslieferung und
#     Auto-Update laufen ausschließlich über GitHub Releases (Arc42 Kap. 2.2).
# Geprüft wird hier also dasselbe, veröffentlicht nur die Webfassung.
#
# Einmalige Einrichtung auf Open CoDE:
#   Deploy -> Pages: Veröffentlichung aktivieren und entscheiden, ob die Seite
#   öffentlich oder nur für angemeldete Nutzer erreichbar ist („Access
#   Control"). Die fertige Adresse steht danach ebenda.

stages: [pruefen, seite]

default:
  # Volles node-Image (nicht -slim): der Klon braucht git, die Submodule werden
  # per https von GitHub nachgezogen, und `playwright install --with-deps`
  # braucht apt.
  image: node:24
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm]
  before_script:
    - npm ci --cache .npm --prefer-offline

variables:
  # Der geteilte Kern hängt als Submodul unter vendor/ (ADR-003) — ohne ihn
  # scheitert schon die Typprüfung.
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  # Volle Historie: die sitemap.xml entsteht im Build und nimmt ihr <lastmod>
  # je Seite aus dem letzten Commit, der sie geändert hat (scripts/sitemap.ts).
  # Ein flacher Klon kennt nur einen Commit; das Skript merkt das und ließe
  # <lastmod> dann ersatzlos weg.
  GIT_DEPTH: "0"

# Der Prüflauf, Schritt für Schritt wie in ci.yml. Er läuft auf jedem Zweig und
# in jedem Merge Request — anders als dort auch auf dem Hauptzweig, denn der
# Pages-Job hängt an ihm: veröffentlicht wird nur ein geprüfter Stand.
pruefen:
  stage: pruefen
  script:
    # Genau eine Kopie je Kern-Baustein (ADR-003).
    - npm run kern-kopien
    - npm run typecheck
    - npm test
    - npm run build
    # Bundle-Budget (ADR-003, Aufnahmeregel 5) — der geteilte Kern darf die PWA
    # nicht schwerer machen.
    - npm run bundle-budget
    # Stückliste aller fremden Bausteine (Hauptrepo + die vier Submodule). Hier
    # nur als Prüfung, dass sie sich erzeugen lässt, und als Artefakt;
    # veröffentlicht wird sie mit dem Release auf GitHub.
    - npm run sbom
    # Was in der ausgelieferten App landet, lässt den Lauf ab „hoch" scheitern —
    # dort sitzt jeder Treffer auf einem Einsatzgerät.
    - npm audit --omit=dev --audit-level=high
  artifacts:
    paths: [sbom.cdx.json]
    expire_in: 30 days

# Das Bau- und Testwerkzeug (rund 1000 Pakete) meldet ständig irgendetwas, ohne
# dass die App davon betroffen wäre. Das gehört ins Protokoll, soll aber nichts
# blockieren — in ci.yml ist das `continue-on-error`, hier ein eigener Job mit
# `allow_failure`, weil ein einzelner Schritt in GitLab nicht scheitern darf,
# ohne den ganzen Job mitzunehmen.
audit-werkzeug:
  stage: pruefen
  allow_failure: true
  script:
    - npm audit --audit-level=high

# Die Cucumber-E2E-Tests brauchen einen Browser. Eigener Job, weil der
# Browser-Download die schnellen Prüfungen sonst ausbremst.
e2e:
  stage: pruefen
  script:
    - npx playwright install --with-deps chromium
    - npm run test:e2e
  artifacts:
    when: on_failure
    paths: [reports]
    expire_in: 7 days

pages:
  stage: seite
  # Nur der Hauptzweig wird veröffentlicht. Die Spiegelung schiebt alle Zweige
  # und Tags herüber; ein Feature-Zweig soll die Seite nicht überschreiben.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    # Footer-Version wie bei den App-Releases aus dem jüngsten Tag. Ohne Tag
    # (frischer Spiegel, noch kein Release) bleibt der Fallback aus
    # package.json — siehe vite.config.ts.
    - export APP_BUILD_VERSION="$(git describe --tags --abbrev=0 2>/dev/null || true)"
    - npm run build
    # GitLab Pages veröffentlicht starr das Verzeichnis `public/`. Das ist hier
    # schon belegt: `public/` sind die statischen Quelldateien, die Vite nach
    # `dist/` kopiert. Statt über das neuere `pages.publish` zu gehen (das
    # ältere GitLab-Fassungen nicht kennen), wird das Quellverzeichnis im
    # Arbeitsbereich des Laufs durch das Bau-Ergebnis ersetzt. Das betrifft nur
    # diesen Lauf, nicht das Repository.
    - rm -rf public && mv dist public
  artifacts:
    paths: [public]
  environment:
    name: pages
    url: $CI_PAGES_URL

# ---------------------------------------------------------------------------
# Vorbereitet, aber stillgelegt: der Release-Weg für den Tag, an dem GitHub
# abgeschaltet wird.
#
# Alles unterhalb dieser Linie ist auskommentiert und bildet die Jobs aus
# .github/workflows/release.yml nach (prepare, build-win, build-linux,
# build-android, build-mac, release, cleanup). Solange GitHub der führende Ort
# ist, darf davon nichts laufen — zwei Release-Kanäle mit je eigener
# Build-Version und eigenen Installern wären schlimmer als einer.
#
# Reihenfolge beim Umschalten (jeder Punkt ist für sich ein eigener Schritt):
#
#   1. Führung umdrehen. Heute ist der Spiegel eine Lesefassung: GitHub
#      überschreibt ihn per `git push --force --prune`. Erst wenn
#      spiegel-opencode.yml abgeschaltet ist, darf hier etwas committet oder
#      getaggt werden — vorher reißt der nächste Spiegellauf es weg.
#   2. `stages:` oben um `freigabe` erweitern.
#   3. package.json anpassen: `build.publish[0].url` zeigt heute auf
#      `https://github.com/wattnpapa/erfassungsbogen/releases/latest/download`.
#      Das ist die Adresse, die in jeder bereits ausgelieferten Desktop-App
#      steckt — wer sie umstellt, erreicht damit nur künftige Installationen.
#      Der Bestand sucht sein Update weiter bei GitHub. Die GitHub-Releases
#      müssen also erreichbar bleiben, bis der Bestand durch ist, oder es
#      braucht ein Übergangs-Release, dessen einziger Zweck die neue Adresse
#      ist.
#   4. CI/CD-Variablen auf Open CoDE hinterlegen (Settings -> CI/CD ->
#      Variables), alle „Masked" und „Protected":
#        GITLAB_PUSH_TOKEN   Projekt-Access-Token, Rolle Maintainer, Scope
#                            `write_repository` — der CI_JOB_TOKEN darf nicht
#                            pushen und kann deshalb keinen Tag anlegen.
#        GITLAB_API_TOKEN    Scope `api`, nur für das Aufräumen alter Releases.
#        ANDROID_KEYSTORE    Variable vom Typ „File" (GitLab kann Dateien
#                            direkt; das base64-Hin-und-Her aus release.yml
#                            entfällt damit).
#        ANDROID_KEYSTORE_PASSWORD
#        CSC_LINK, CSC_KEY_PASSWORD, APPLE_API_KEY_ID, APPLE_API_ISSUER,
#        APPLE_API_KEY_BASE64   nur für macOS, siehe build-mac.
#   5. Runner prüfen. Die Linux-Jobs laufen auf jedem Docker-Runner. Windows
#      und macOS brauchen je einen Runner mit dem passenden Betriebssystem;
#      stellt die Instanz keinen, bleiben diese beiden Jobs stillgelegt und es
#      gibt von dort keine .exe und keine .dmg.
#   6. Die Auslieferungswege in README.md, Arc42 Kap. 2.2/7, ISK 3.6 und DSFA
#      Abschnitt 3/5.8 nachziehen — dort steht heute überall „ausschließlich
#      über GitHub Releases".
