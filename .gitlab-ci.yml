# GitLab-CI für den Open-CoDE-Spiegel (gitlab.opencode.de).
#
# Gegenstück zu den GitHub-Actions-Workflows: Die Prüfstufe bildet
# .github/workflows/ci.yml Schritt für Schritt nach, die Paketstufe die
# Build-Jobs aus .github/workflows/release.yml, der Pages-Job dessen
# build-pages/deploy-pages. Beide Plattformen bauen aus demselben Stand; GitHub
# ignoriert diese Datei, GitLab ignoriert .github/. Gespiegelt wird nur in eine
# Richtung (GitHub -> Open CoDE), die Datei gehört also ins GitHub-Repository
# und reist von dort mit.
#
# Seit dem 15.9.2026 entsteht hier auch das Release: Die Stufe `freigabe` lädt
# die Pakete in die Generic Package Registry des Projekts und legt ein
# GitLab-Release an, das sie von dort verlinkt. Darauf zeigt der Auto-Update-
# Kanal der App (`build.publish` in package.json) über den Permalink
# `/-/releases/permalink/latest/downloads/<datei>`.
#
# Einen Tag legt diese Datei weiterhin NICHT an, und das ist der Kern des
# Aufbaus: Getaggt wird nach wie vor auf GitHub (`prepare` in release.yml), der
# Tag kommt mit der Spiegelung herüber, und der Job `version` liest ihn. Ein
# hier erzeugter Tag wäre beim nächsten Spiegellauf weg (`git push --force
# --prune`). Releases und Pakete sind keine Git-Refs — die überlebt die
# Spiegelung unangetastet.
#
# Solange auf GitHub ebenfalls noch Releases entstehen, gibt es die Pakete an
# beiden Orten. Das ist Absicht und begrenzt: Vor dem Umzug installierte Apps
# fragen ihr Update weiterhin bei GitHub an — die Adresse steckt fest in der
# installierten Fassung. Erst wenn dieser Bestand durch ist, kann der
# `release`-Job in release.yml abgeschaltet werden.
#
# Einmalige Einrichtung auf Open CoDE:
#   * Deploy -> Pages: Veröffentlichung aktivieren und entscheiden, ob die Seite
#     öffentlich oder nur für angemeldete Nutzer erreichbar ist („Access
#     Control").
#   * Für signierte Pakete die Variablen aus dem Abschnitt am Dateiende
#     hinterlegen. Ohne sie bauen die Jobs unsigniert durch — brauchbar zum
#     Prüfen, nicht zum Verteilen.
#   * Settings -> Packages and registries: Package Registry aktiviert lassen —
#     dort landen Installer, APK und SBOM, das Release verlinkt sie von da.
#   * Optional GITLAB_API_TOKEN (Projekt-Access-Token, Scope `api`) für den
#     Job `aufraeumen`; ohne es bleiben alte Releases einfach stehen.
#   * Die Jobs für Windows und macOS sind stillgelegt (`when: never`). Wer sie
#     wiederbeleben will, braucht je einen Runner mit passendem Betriebssystem.

stages: [pruefen, pakete, freigabe, seite]

default:
  # Volles node-Image (nicht -slim): der Klon braucht git, die Submodule werden
  # per https von GitHub nachgezogen, und `playwright install --with-deps`
  # braucht apt.
  image: node:24
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm]
  before_script:
    - npm ci --cache .npm --prefer-offline

variables:
  # Der geteilte Kern hängt als Submodul unter vendor/ (ADR-003) — ohne ihn
  # scheitert schon die Typprüfung.
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  # Volle Historie: die sitemap.xml entsteht im Build und nimmt ihr <lastmod>
  # je Seite aus dem letzten Commit, der sie geändert hat (scripts/sitemap.ts).
  # Ein flacher Klon kennt nur einen Commit; das Skript merkt das und ließe
  # <lastmod> dann ersatzlos weg. Die Build-Jobs brauchen die Tags außerdem für
  # die Versionsnummer (Job `version`).
  GIT_DEPTH: "0"

# ---------------------------------------------------------------------------
# Stufe 1: prüfen
# ---------------------------------------------------------------------------

# Der Prüflauf, Schritt für Schritt wie in ci.yml. Er läuft auf jedem Zweig und
# in jedem Merge Request — anders als dort auch auf dem Hauptzweig, denn Pakete
# und Pages hängen an ihm: gebaut und veröffentlicht wird nur ein geprüfter
# Stand.
pruefen:
  stage: pruefen
  script:
    # Genau eine Kopie je Kern-Baustein (ADR-003).
    - npm run kern-kopien
    - npm run typecheck
    - npm test
    - npm run build
    # Bundle-Budget (ADR-003, Aufnahmeregel 5) — der geteilte Kern darf die PWA
    # nicht schwerer machen.
    - npm run bundle-budget
    # Stückliste aller fremden Bausteine (Hauptrepo + die vier Submodule). Hier
    # nur als Prüfung, dass sie sich erzeugen lässt, und als Artefakt;
    # veröffentlicht wird sie mit dem Release auf GitHub.
    - npm run sbom
    # Was in der ausgelieferten App landet, lässt den Lauf ab „hoch" scheitern —
    # dort sitzt jeder Treffer auf einem Einsatzgerät.
    - npm audit --omit=dev --audit-level=high
  artifacts:
    paths: [sbom.cdx.json]
    expire_in: 30 days

# Das Bau- und Testwerkzeug (rund 1000 Pakete) meldet ständig irgendetwas, ohne
# dass die App davon betroffen wäre. Das gehört ins Protokoll, soll aber nichts
# blockieren — in ci.yml ist das `continue-on-error`, hier ein eigener Job mit
# `allow_failure`, weil ein einzelner Schritt in GitLab nicht scheitern darf,
# ohne den ganzen Job mitzunehmen.
audit-werkzeug:
  stage: pruefen
  allow_failure: true
  script:
    - npm audit --audit-level=high

# Die Cucumber-E2E-Tests brauchen einen Browser. Eigener Job, weil der
# Browser-Download die schnellen Prüfungen sonst ausbremst.
e2e:
  stage: pruefen
  script:
    - npx playwright install --with-deps chromium
    - npm run test:e2e
  artifacts:
    when: on_failure
    paths: [reports]
    expire_in: 7 days

# Eine Build-Version für alle Paket-Jobs, damit Installer, APK und Dateinamen
# desselben Laufs zusammenpassen.
#
# Anders als `prepare` in release.yml legt dieser Job KEINEN Tag an: Der Spiegel
# ist eine Lesefassung, ein hier erzeugter Tag wäre beim nächsten Spiegellauf
# weg. Stattdessen wird der Tag benutzt, den GitHub für diesen Commit erzeugt
# hat und der mitgespiegelt wurde. Ist er noch nicht da — Spiegelung und Release
# laufen drüben gleichzeitig, der Tag kann Sekunden später eintreffen —, wird
# dieselbe Form aus der Uhr gebildet und mit dem Kurz-SHA gekennzeichnet. So ist
# an der Versionsnummer ablesbar, ob ein Paket zu einem GitHub-Release gehört
# oder ein Zwischenstand vom Spiegel ist.
version:
  stage: pruefen
  cache: {}
  before_script: []
  script:
    - |
      TAG="$(git tag --points-at "$CI_COMMIT_SHA" | sort -V | tail -n1)"
      if [ -n "$TAG" ]; then
        BUILD_VERSION="$TAG"
      else
        # Format YYYY.MMDD.HHMM wie in release.yml: zugleich gültiges SemVer
        # (electron/npm) und CFBundleShortVersionString (iOS), minutengenau und
        # über Tages-/Jahresgrenzen monoton steigend. Das Suffix macht den
        # Zwischenstand erkennbar und bleibt SemVer-gültig.
        Y=$(date -u +%Y)
        MMDD=$(( 10#$(date -u +%m) * 100 + 10#$(date -u +%d) ))
        HHMM=$(( 10#$(date -u +%H) * 100 + 10#$(date -u +%M) ))
        BUILD_VERSION="$Y.$MMDD.$HHMM-spiegel.$CI_COMMIT_SHORT_SHA"
      fi
      echo "BUILD_VERSION=$BUILD_VERSION" > version.env
      echo "APP_BUILD_VERSION=$BUILD_VERSION" >> version.env
      # Veröffentlicht wird nur, was zu einem Tag gehört. Ein Zwischenstand vom
      # Spiegel (Suffix -spiegel.<sha>) wird gebaut und bleibt Artefakt.
      if [ -n "$TAG" ]; then echo "IST_RELEASE=ja" >> version.env; else echo "IST_RELEASE=nein" >> version.env; fi
      cat version.env
  # dotenv statt „job outputs": so sehen alle Paket-Jobs dieselbe Version, ohne
  # sie neu aus der Uhr zu lesen — zwei Jobs um 10:59:59 und 11:00:00 kämen
  # sonst auf verschiedene Versionen.
  artifacts:
    reports:
      dotenv: version.env

# ---------------------------------------------------------------------------
# Stufe 2: Pakete
#
# Dieselben electron-builder- und Gradle-Aufrufe wie in release.yml. Die
# Ergebnisse hängen als Artefakt am Lauf (30 Tage) und gehen nicht in ein
# Release.
# ---------------------------------------------------------------------------

.paket:
  stage: pakete
  # Wie in release.yml, wo build-* an `check` hängt und dort auch die E2E-Tests
  # laufen: gebaut wird nur, was den ganzen Prüflauf bestanden hat.
  needs: [version, pruefen, e2e]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  artifacts:
    paths: [release/]
    expire_in: 30 days

build-linux:
  extends: .paket
  script:
    # libarchive-tools liefert bsdtar für das .pacman-Paket, fakeroot braucht
    # electron-builder für das .deb (auf dem GitHub-Runner ist beides schon da).
    - apt-get update && apt-get install -y libarchive-tools fakeroot
    - npm pkg set version="$BUILD_VERSION"
    - npm run build
    # ${version} statt ${BUILD_VERSION}: electron-builder ersetzt im
    # artifactName nur seine eigenen Makros, und eine Shell-Variable ist keines
    # („macro BUILD_VERSION is not defined"). ${version} ist die Version aus
    # package.json — die Zeile darüber hat sie gerade auf BUILD_VERSION gesetzt.
    - npx electron-builder --linux --x64 --publish never --config.artifactName='Erfassungsbogen-${version}-${os}-${arch}.${ext}'
    - node scripts/ensure-update-metadata.cjs linux

build-android:
  extends: .paket
  # node:24 steht auf Debian bookworm, und dort gibt es kein openjdk-21 (auch
  # nicht in bookworm-backports, geprüft). Die trixie-Variante desselben
  # node-Images bringt openjdk-21 mit — das ist dieselbe JDK-Hauptversion, die
  # release.yml über setup-java/temurin 21 benutzt.
  image: node:24-trixie
  variables:
    # SDK und Gradle-Zwischenstand liegen im Projektverzeichnis, damit der Cache
    # sie aufnehmen kann — sonst lädt jeder Lauf rund ein Gigabyte neu.
    ANDROID_SDK_ROOT: $CI_PROJECT_DIR/.android-sdk
    ANDROID_HOME: $CI_PROJECT_DIR/.android-sdk
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle
  cache:
    - key:
        files: [package-lock.json]
      paths: [.npm]
    - key: android-sdk-36
      paths: [.android-sdk, .gradle/caches, .gradle/wrapper]
  script:
    # JDK 21 wie auf dem GitHub-Runner (setup-java, temurin 21).
    - apt-get update && apt-get install -y openjdk-21-jdk-headless unzip
    # Android-SDK einmalig einrichten; compileSdk/targetSdk 36 laut
    # android/variables.gradle.
    - |
      if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-36" ]; then
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        curl -fsSL -o /tmp/cmdline-tools.zip \
          https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
        mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
        yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
        "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
          "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      fi
    - npm run build
    - npx cap sync android
    - mkdir -p release
    # Signiert nur, wenn ANDROID_KEYSTORE hinterlegt ist (File-Variable:
    # GitLab legt sie als Datei ab und setzt den Pfad in die Variable — genau
    # das erwartet android/app/build.gradle über ANDROID_KEYSTORE_PATH). Ohne
    # sie entsteht app-release-unsigned.apk; der Dateiname sagt es dann auch.
    - |
      cd android
      if [ -n "$ANDROID_KEYSTORE" ]; then
        export ANDROID_KEYSTORE_PATH="$ANDROID_KEYSTORE"
      fi
      # versionCode muss pro Release monoton steigen (Minuten seit Epoche).
      ./gradlew assembleRelease \
        -PappVersionCode=$(( $(date -u +%s) / 60 )) \
        -PappVersionName="$BUILD_VERSION"
      AUSGABE=app/build/outputs/apk/release
      if [ -f "$AUSGABE/app-release.apk" ]; then
        cp "$AUSGABE/app-release.apk" "$CI_PROJECT_DIR/release/Erfassungsbogen-$BUILD_VERSION-android.apk"
      else
        cp "$AUSGABE/app-release-unsigned.apk" "$CI_PROJECT_DIR/release/Erfassungsbogen-$BUILD_VERSION-android-unsigniert.apk"
      fi

# Windows und macOS brauchen je einen Runner mit dem passenden Betriebssystem;
# electron-builder kann den NSIS-Installer und das .dmg nicht unter Linux
# erzeugen. Beide Jobs sind stillgelegt (`when: never`, 15.9.2026): Einen
# solchen Runner gibt es hier nicht, und auf GitHub sind dieselben beiden
# Bauten ebenfalls abgeschaltet (`if: false` an build-win/build-mac in
# release.yml). Die Job-Definitionen bleiben stehen, damit das Wiedereinschalten
# eine Zeile ist: `when: never` gegen `when: manual` (oder ganz weg, sobald ein
# Runner dauerhaft bereitsteht) tauschen.
#
# Der Runner muss Node 24 und npm mitbringen (das `image` oben gilt nur für
# Docker-Runner; ein Shell-Runner ignoriert es).
.paket-fremdes-os:
  extends: .paket
  rules:
    - when: never

build-win:
  extends: .paket-fremdes-os
  tags: [windows]
  script:
    - npm pkg set version="$BUILD_VERSION"
    - npm run build
    # Zwei getrennte Läufe, damit je Architektur ein eigener Installer
    # entsteht. ARM64 zuerst: Beide Läufe schreiben dieselbe latest.yml, und die
    # soll am Ende (samt Blockmap für differenzielle Updates) auf das x64-Paket
    # zeigen — die ARM64-Metadaten legt das Skript danach an. ARM64 ist kein
    # Luxus: Auf Snapdragon-Geräten kommt die emulierte x64-App nicht an die
    # Kamera, der QR-Scan bliebe dort schwarz.
    - npx electron-builder --win --arm64 --publish never --config.artifactName='Erfassungsbogen-${version}-${os}-${arch}.${ext}'
    - npx electron-builder --win --x64 --publish never --config.artifactName='Erfassungsbogen-${version}-${os}-${arch}.${ext}'
    - node scripts/ensure-update-metadata.cjs win

build-mac:
  extends: .paket-fremdes-os
  tags: [macos]
  script:
    - npm pkg set version="$BUILD_VERSION"
    - npm run build
    # Signiert und notarisiert, sobald CSC_LINK und die Apple-Variablen
    # hinterlegt sind: dann startet die .dmg per Doppelklick und die App
    # aktualisiert sich selbst. Ohne sie unsigniert (Gatekeeper: Rechtsklick ->
    # Öffnen, kein Auto-Update) — dafür muss die Identitätssuche aus sein.
    # Achtung: Mit CSC_LINK darf CSC_IDENTITY_AUTO_DISCOVERY NICHT gesetzt
    # sein, sonst überspringt electron-builder die Suche trotz Zertifikat.
    #
    # Auf dem GitHub-Runner ist dieser Build seit dem 2026-09-05 stillgelegt,
    # weil die Signatur dort abbricht („security set-key-partition-list …
    # process failed 1"). Die Ursache sitzt im Schlüsselbund des Runners und
    # wandert mit: auf einem eigenen Mac-Runner erst von Hand signieren, dann
    # diesem Job die Variablen geben.
    - |
      if [ -z "$CSC_LINK" ]; then
        export CSC_IDENTITY_AUTO_DISCOVERY=false
      fi
      if [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_KEY_BASE64" ]; then
        SCHLUESSEL="$CI_PROJECT_DIR/.apple/AuthKey_${APPLE_API_KEY_ID}.p8"
        mkdir -p "$(dirname "$SCHLUESSEL")"
        printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$SCHLUESSEL"
        export APPLE_API_KEY="$SCHLUESSEL"
        NOTARIZE=--config.mac.notarize=true
      fi
      npx electron-builder --mac --publish never ${NOTARIZE:-} \
        --config.artifactName='Erfassungsbogen-${version}-${os}-${arch}.${ext}'
    - node scripts/ensure-update-metadata.cjs mac

# ---------------------------------------------------------------------------
# Stufe 3: Webfassung veröffentlichen
# ---------------------------------------------------------------------------

pages:
  stage: seite
  # Hängt nur an der Prüfstufe, nicht an den Paket-Jobs: die Seite soll nicht
  # darauf warten, dass ein Installer fertig ist.
  needs: [pruefen]
  # Nur der Hauptzweig wird veröffentlicht. Die Spiegelung schiebt alle Zweige
  # und Tags herüber; ein Feature-Zweig soll die Seite nicht überschreiben.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    # Footer-Version wie bei den App-Releases aus dem jüngsten Tag. Ohne Tag
    # (frischer Spiegel, noch kein Release) bleibt der Fallback aus
    # package.json — siehe vite.config.ts.
    - export APP_BUILD_VERSION="$(git describe --tags --abbrev=0 2>/dev/null || true)"
    - npm run build
    # GitLab Pages veröffentlicht starr das Verzeichnis `public/`. Das ist hier
    # schon belegt: `public/` sind die statischen Quelldateien, die Vite nach
    # `dist/` kopiert. Statt über das neuere `pages.publish` zu gehen (das
    # ältere GitLab-Fassungen nicht kennen), wird das Quellverzeichnis im
    # Arbeitsbereich des Laufs durch das Bau-Ergebnis ersetzt. Das betrifft nur
    # diesen Lauf, nicht das Repository.
    - rm -rf public && mv dist public
  artifacts:
    paths: [public]
  environment:
    name: pages
    url: $CI_PAGES_URL

# ---------------------------------------------------------------------------
# Variablen für signierte Pakete
#
# Ohne sie bauen die Jobs oben unsigniert durch. Alle unter Settings -> CI/CD ->
# Variables, „Masked" und „Protected":
#
#   ANDROID_KEYSTORE           Typ „File" — GitLab legt die Datei ab und setzt
#                              den Pfad in die Variable. Kein base64-Umweg wie
#                              in release.yml nötig. Schlüsselalias:
#                              `erfassungsbogen` (android/app/build.gradle).
#   ANDROID_KEYSTORE_PASSWORD
#   CSC_LINK                   macOS-Zertifikat (.p12, base64 oder URL).
#   CSC_KEY_PASSWORD
#   APPLE_API_KEY_ID           App-Store-Connect-Key für die Notarisierung.
#   APPLE_API_ISSUER
#   APPLE_API_KEY_BASE64
#
# Dazu, nicht fürs Signieren, sondern fürs Aufräumen:
#
#   GITLAB_API_TOKEN           Projekt-Access-Token, Scope `api`. Nur der Job
#                              `aufraeumen` benutzt es; fehlt es, bleiben alte
#                              Releases stehen.
#
# Windows-Signierung ist auch auf GitHub nicht eingerichtet; der NSIS-Installer
# ist dort ebenfalls unsigniert.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Stufe 3: Freigabe — Pakete in die Registry, Release anlegen
#
# Ein GitLab-Release trägt keine Dateien, es verweist nur auf URLs. Installer,
# APK und SBOM gehen deshalb zuerst in die Generic Package Registry des
# Projekts; das Release verlinkt sie von dort. `direct_asset_path` ist dabei
# nicht bloß Kosmetik: Nur damit ist jede Datei unter
# `/-/releases/permalink/latest/downloads/<datei>` erreichbar, und genau diese
# Adresse steht in `build.publish` (package.json). electron-updater holt sich
# dort `latest.yml` und daneben das Paket.
# ---------------------------------------------------------------------------

freigabe:
  stage: freigabe
  # `pruefen` steht mit in der Liste, weil dort die SBOM entsteht, die mit
  # veröffentlicht wird. build-win und build-mac fehlen, weil sie stillgelegt
  # sind — sonst wartet das Release auf einen Job, der nie startet.
  needs: [version, pruefen, build-linux, build-android]
  before_script: []
  cache: {}
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      set -euo pipefail
      if [ "${IST_RELEASE:-nein}" != "ja" ]; then
        echo "Kein Tag auf diesem Commit — Zwischenstand, kein Release."
        exit 0
      fi
      BASIS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/erfassungsbogen/${BUILD_VERSION}"
      : > dateien.txt
      for datei in release/* sbom.cdx.json; do
        [ -f "$datei" ] || continue
        name=$(basename "$datei")
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$datei" "$BASIS/$name"
        printf '%s\t%s\n' "$name" "$BASIS/$name" >> dateien.txt
      done
      # Payload mit node bauen statt mit jq: node ist im Image, jq nicht, und
      # Dateinamen mit Sonderzeichen sind so ohne Zitier-Akrobatik richtig
      # kodiert. `direct_asset_path` macht die Datei unter dem Permalink
      # erreichbar (siehe Kopf dieses Abschnitts).
      node -e '
        const fs = require("node:fs");
        const zeilen = fs.readFileSync("dateien.txt", "utf8").trim().split("\n").filter(Boolean);
        const links = zeilen.map((z) => {
          const [name, url] = z.split("\t");
          return { name, url, direct_asset_path: `/${name}`, link_type: "package" };
        });
        const tag = process.env.BUILD_VERSION;
        fs.writeFileSync("release.json", JSON.stringify({
          name: tag, tag_name: tag, assets: { links },
        }));
      '
      curl --fail --silent --show-error --request POST \
        --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --header "Content-Type: application/json" \
        --data @release.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
      echo "Release $BUILD_VERSION angelegt."

# Gegenstück zum cleanup-Job in release.yml: nur die neuesten KEEP Releases
# bleiben stehen. Entfernt wird das Release, nicht der Tag — der gehört GitHub
# und kommt mit der Spiegelung. Meist räumt schon GitHub mit auf: dort löscht
# `cleanup` Release und Tag, der nächste Spiegellauf nimmt den Tag per `--prune`
# auch hier weg, und mit dem Tag verschwindet das zugehörige GitLab-Release.
# Dieser Job ist das Netz für die Fälle, in denen das nicht greift. Die Pakete in der Registry bleiben ebenfalls
# liegen; sie aufzuräumen wäre ein zweiter Schritt (API
# `/packages`), der ein Token mit `api`-Rechten braucht.
#
# Ohne hinterlegtes GITLAB_API_TOKEN (Projekt-Access-Token, Scope `api`) läuft
# der Job nicht — das ist kein Fehlerfall, der ein Release verhindern soll,
# deshalb `allow_failure`.
aufraeumen:
  stage: freigabe
  needs: [version, freigabe]
  before_script: []
  cache: {}
  allow_failure: true
  variables:
    KEEP: "10"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      set -euo pipefail
      if [ -z "${GITLAB_API_TOKEN:-}" ]; then
        echo "GITLAB_API_TOKEN nicht hinterlegt — nichts aufgeräumt."
        exit 0
      fi
      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
      curl --fail --silent --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
        "$API/releases?per_page=100" > releases.json
      node -e '
        const rel = require("./releases.json");
        const keep = Number(process.env.KEEP);
        rel.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        console.log(rel.slice(keep).map((r) => r.tag_name).join("\n"));
      ' > alte.txt
      while read -r tag; do
        [ -z "$tag" ] && continue
        echo "Entferne Release $tag"
        curl --fail --silent --request DELETE \
          --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" "$API/releases/$tag" > /dev/null
      done < alte.txt

# ---------------------------------------------------------------------------
# Noch offen für den Tag, an dem GitHub abgeschaltet wird
#
#   1. Führung umdrehen. Heute überschreibt GitHub den Spiegel per
#      `git push --force --prune` (spiegel-opencode.yml). Erst wenn dieser
#      Workflow abgeschaltet ist, darf hier committet oder getaggt werden.
#   2. Den Tag hier anlegen statt ihn zu lesen — im Job `version`:
#        git config user.email "ci@$CI_SERVER_HOST"
#        git config user.name "GitLab CI"
#        git tag "$BUILD_VERSION" "$CI_COMMIT_SHA"
#        git push "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$BUILD_VERSION"
#      Dafür braucht es GITLAB_PUSH_TOKEN (Projekt-Access-Token, Rolle
#      Maintainer, Scope `write_repository`); der CI_JOB_TOKEN darf nicht pushen.
#   3. In release.yml den `release`-Job abschalten, sobald der Bestand an
#      Installationen durch ist, die ihr Update noch bei GitHub suchen.
