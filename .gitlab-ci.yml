#         [ -f "$datei" ] || continue
#         name=$(basename "$datei")
#         curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
#           --upload-file "$datei" "$BASIS/$name"
#         printf '%s %s\n' "$name" "$BASIS/$name" >> links.txt
#       done
#     # Schritt 2: Release anlegen und jede Datei als Asset verlinken.
