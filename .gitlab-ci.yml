#       while read -r name url; do
#         ARGS="$ARGS --assets-link {\"name\":\"$name\",\"url\":\"$url\"}"
#       done < links.txt
#       release-cli create --name "$BUILD_VERSION" --tag-name "$BUILD_VERSION" $ARGS
#   rules:
#     - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
#
# aufraeumen:
#   stage: freigabe
#   needs: [freigabe]
#   before_script: []
#   cache: {}
#   # Gegenstück zu cleanup in release.yml: nur die neuesten KEEP Releases
#   # bleiben online, damit sich nicht endlos Builds ansammeln. Der Aufruf
#   # entfernt Release und Tag über die GitLab-API; die zugehörigen Pakete in
#   # der Registry bleiben und wären ein zweiter Schritt.
#   variables:
#     KEEP: 10
#   script:
#     - apt-get update && apt-get install -y jq
#     - |
#       API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
#       curl --fail --silent --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" \
#         "$API/releases?per_page=300" \
#         | jq -r 'sort_by(.created_at) | reverse | .[].tag_name' \
#         | tail -n +"$((KEEP + 1))" \
#         | while read -r tag; do
