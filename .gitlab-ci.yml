# ---------------------------------------------------------------------------
#
# # Einschub für den Job `version`, Schritt 3 oben: statt den gespiegelten Tag
# # zu lesen, selbst einen anlegen. Über HTTPS mit Projekt-Access-Token, weil
# # der CI_JOB_TOKEN nur lesen darf.
# tag-anlegen:
#   - git config user.email "ci@$CI_SERVER_HOST"
#   - git config user.name "GitLab CI"
#   - git tag "$BUILD_VERSION" "$CI_COMMIT_SHA"
#   - git push "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$BUILD_VERSION"
#
# freigabe:
#   stage: freigabe
#   # `pruefen` steht mit in der Liste, weil dort die SBOM entsteht, die mit
#   # veröffentlicht wird. build-win und build-mac fehlen absichtlich, solange
#   # es für sie keine Runner gibt — sonst wartet das Release auf einen Job, der
#   # nie startet.
#   needs: [version, pruefen, build-linux, build-android]
