# GitLab-Release trägt keine Dateien, es verweist nur auf URLs. Installer und
# SBOM gehen deshalb zuerst in die Generic Package Registry des Projekts, und
# das Release verlinkt sie von dort. Für electron-updater ist das gleichwertig
# — der `generic`-Provider will ohnehin nur ein Verzeichnis voller Dateien —,
# die Adressen sehen aber anders aus als bei GitHub.
