#             curl --fail --silent --request DELETE --header "PRIVATE-TOKEN: $GITLAB_API_TOKEN" "$API/repository/tags/$tag"
#           done
#   rules:
#     - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
