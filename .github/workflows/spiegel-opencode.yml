# Spiegelt dieses Repository nach Open CoDE (gitlab.opencode.de).
#
# Open CoDE ist die Open-Source-Plattform der öffentlichen Verwaltung. Die
# Fassung dort soll dem GitHub-Stand entsprechen, ohne dass jemand daran
# denken muss — deshalb läuft die Spiegelung bei jedem Push, bei jedem Tag,
# beim Löschen eines Zweigs und zusätzlich einmal täglich als Netz für den
# Fall, dass ein Lauf ausgefallen ist.
#
# Richtung: nur GitHub -> Open CoDE. Was dort direkt committet wird, geht beim
# nächsten Lauf verloren (`git push --mirror` überschreibt und räumt auf).
# Open CoDE ist eine Kopie zum Lesen, kein zweites Arbeits-Repository.
#
# Einmalige Einrichtung:
#   1. Schlüsselpaar erzeugen (ohne Passphrase):
#      ssh-keygen -t ed25519 -C "spiegel-github" -f opencode_deploy -N ""
#   2. Öffentlichen Teil (opencode_deploy.pub) bei Open CoDE unter
#      Settings -> Repository -> Deploy keys mit Schreibrecht hinterlegen.
#   3. Privaten Teil (opencode_deploy) hier als Repository-Secret
#      OPENCODE_SSH_KEY hinterlegen, danach beide Dateien lokal löschen.

name: Spiegel nach Open CoDE

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

# Zwei Spiegelläufe gleichzeitig würden sich gegenseitig überholen; der
# jüngere Stand gewinnt, ältere Läufe werden nicht abgebrochen, sondern
# nacheinander abgearbeitet.
concurrency:
  group: spiegel-opencode
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  spiegeln:
    runs-on: ubuntu-latest
    # Forks haben das Secret nicht und sollen fremde Stände auch nicht in den
    # amtlichen Spiegel schieben.
    if: github.repository == 'wattnpapa/erfassungsbogen'
    steps:
      - name: SSH-Schlüssel bereitlegen
        env:
          SSH_KEY: ${{ secrets.OPENCODE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H gitlab.opencode.de >> ~/.ssh/known_hosts 2>/dev/null
          # Damit sich bei „Permission denied" unterscheiden lässt, ob das
          # Secret kaputt ist oder der Schlüssel drüben nur nicht eingetragen
          # wurde: der Fingerabdruck ist öffentlich und muss mit dem Deploy-Key
          # auf Open CoDE übereinstimmen.
          ssh-keygen -lf ~/.ssh/id_ed25519

      # Ein blanker Spiegel-Klon statt actions/checkout: nur so sind alle
      # Zweige und Tags vollständig da und nicht bloß der gebaute Stand.
      - name: SSH-Verbindung prüfen (Diagnose)
        continue-on-error: true
        run: |
          wc -c ~/.ssh/id_ed25519
          head -1 ~/.ssh/id_ed25519
          tail -1 ~/.ssh/id_ed25519
          ssh -vT -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 git@gitlab.opencode.de 2>&1 | tail -40

      - name: Vollständigen Klon von GitHub holen
        run: git clone --mirror "https://github.com/${{ github.repository }}.git" spiegel.git

      - name: Nach Open CoDE schieben
        run: |
          set -euo pipefail
          cd spiegel.git
          # Kein `--mirror`: das würde auch refs/merge-requests/* auf der
          # Gegenseite löschen wollen — die gehören GitLab, sind schreibgeschützt
          # und brächten den gesamten Push zu Fall. Ebenso bleibt refs/pull/*
          # von GitHub hier, wo es hingehört. Gespiegelt werden Zweige und Tags,
          # `--prune` räumt drüben auf, was hier verschwunden ist.
          git push --force --prune \
            git@gitlab.opencode.de:oc000172112778/erfassungsbogen.git \
            'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
